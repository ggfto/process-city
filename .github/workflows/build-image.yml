# Builda a imagem do process-city e publica no GHCR.
#
# Por que existe: um stack do Portainer recebe apenas o arquivo compose, sem a
# arvore do repositorio, entao qualquer 'build:' falha ali com "unable to prepare
# context". A imagem precisa chegar pronta em um registry. O docker-compose.yml
# da raiz continua com 'build:' para desenvolvimento local; quem o Portainer usa
# e o deploy/portainer-compose.yml, que referencia esta imagem.
name: build-image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ggfto/process-city
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
